# 실험이름 | s1 추가 인자     (이름이 --run 이름 = runs/<이름>/ = results/<실험이름>/ 폴더)
# 이 파일은 실행하지 않는다 — ./colab/sweep.sh plan / up / start 가 읽는다.
# 실험은 항상 VM 2대로 병렬 : 슬롯 1 = 1·3·5… 번째 줄, 슬롯 2 = 2·4·6… 번째 줄 (./colab/sweep.sh plan 으로 확인)
#
# (2026-09-26) 9B 기준 (지금까지 Kaggle 은 전부 0.96 이하). config 기본값 = 방법 1·2·3(언어 모델 쪽)·5 가 이미 들어 있다:
#   1) 모델 qwen3.5-9b-bf16   2) 학습 해상도 1024 (추론과 같게)
#   3) LoRA lm_all : 언어 모델 선형층 전부 — 9B 의 선형 어텐션 24층 포함 (예전 attn+mlp 는 이 24층을 놓쳤다)
#   5) 4단계 reason : 선별 문항만 생각을 쓰고 답하기 (+ grounding). 최종 단계가 valid 로 둘 중/교체 안 함을 고름
# 두 줄은 LoRA 범위 하나만 다르다 → 비전 인코더 LoRA(방법 3 의 비전 쪽)의 효과를 본다
q9b     |
q9b_vis | --lora-targets lm_all+vision

# 이전 쌍 (8B, 2026-09-25) : 증강 데이터 효과 — --train-source 하나만 다름
# b8_orig | --preset qwen3-vl-8b --grad-ckpt --micro-batch 8 --eval-every 200 --eval-batch 16 --train-source orig
# b8_aug  | --preset qwen3-vl-8b --grad-ckpt --micro-batch 8 --eval-every 200 --eval-batch 16
#
# 이전 쌍 (4B) : 학습 hint 비율만 다름 — aug_r16 완료, aug_hint50 은 보류
# aug_r16    | --preset qwen3-vl-4b --no-grad-ckpt --micro-batch 2 --train-max-side 768 --lora-targets attn+mlp
# aug_hint50 | --preset qwen3-vl-4b --no-grad-ckpt --micro-batch 2 --train-max-side 768 --lora-targets attn+mlp --hint-prob 0.5 --eval-prompt-mode qtype
